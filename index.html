<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Missões - Investigação</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e8b4b8">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #e8b4b8;
            --primary-light: #f3d6d8;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --border-color: #333333;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 0.85rem;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .mission-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .mission-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            border-radius: 6px;
        }

        .mission-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .mission-title {
            font-size: 1.1rem;
            color: var(--primary-light);
            margin: 0;
        }

        .badge {
            align-self: flex-start;
            font-size: 0.75rem;
            padding: 3px 6px;
            border-radius: 3px;
            background: #333;
            color: var(--primary-color);
        }

        .mission-summary {
            color: #b0b0b0;
            font-size: 0.9rem;
            margin-bottom: 12px;
            line-height: 1.4;
        }

      .objectives-list {
    list-style-type: none;
    padding: 0;
    margin: 10px 0 15px 0;
}

.objective-item {
    background: #252525;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 4px;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    border-left: 3px solid #555;
    transition: background 0.2s;
}

.objective-item:active {
    background: #333;
}

.objective-item.completed {
    border-left-color: var(--primary-color);
    color: var(--text-muted);
    text-decoration: line-through;
}

.checkbox {
    font-size: 1.1rem;
    color: var(--primary-color);
}

        .btn-launch {
            width: 100%;
            background-color: var(--primary-color);
            color: #121212;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn-launch:active {
            background-color: var(--primary-light);
            transform: scale(0.98);
        }

        .btn-launch:disabled {
            background-color: #2a2a2a;
            color: #555;
            cursor: not-allowed;
        }
        .options-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
}

.btn-option {
    background-color: #252525;
    color: #e0e0e0;
    border: 1px solid #444;
    border-left: 4px solid var(--primary-color);
    padding: 12px 15px;
    text-align: left;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.2s, border-color 0.2s;
}

.btn-option:active {
    background-color: #333;
    border-color: var(--primary-light);
}

.btn-reset-step {
    background: transparent;
    color: #888;
    border: 1px dashed #444;
    padding: 8px;
    width: 100%;
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    border-radius: 4px;
    margin-top: 10px;
}

.btn-reset-step:hover {
    color: #e8b4b8;
    border-color: #e8b4b8;
}
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CENTRAL DE INVESTIGAÇÃO</h1>
            <p class="subtitle">Selecione uma missão para iniciar</p>
        </header>

        <main class="mission-grid" id="missionGrid">
            <!-- Injetado via JS -->
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
