<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tribunal & Investigação - Cumbuco Case</title>
    <meta name="theme-color" content="#e8b4b8">
    <style>
        :root {
            --bg-color: #0d0d12;
            --panel-bg: #161622;
            --primary: #e8b4b8;
            --primary-light: #f3d6d8;
            --accent-red: #d9534f;
            --accent-blue: #337ab7;
            --text-main: #f0f0f0;
            --text-muted: #999;
            --border: #333344;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        *, *::before, *::after { box-sizing: border-box; }

        header {
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.25rem;
            letter-spacing: 1px;
        }

        .game-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Estilo Visual Ace Attorney: Caixa de Diálogo / Testemunho */
        .dialogue-box {
            background-color: var(--panel-bg);
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }

        .speaker-tag {
            background: var(--primary);
            color: #121212;
            font-weight: bold;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .scene-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }

        .dialogue-text {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #ddd;
            margin-bottom: 15px;
        }

        /* Botões de Ação estilo Ace Attorney */
        .actions-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-action {
            background-color: #222233;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            padding: 10px 12px;
            text-align: left;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-action:active {
            background-color: #333344;
        }

        /* Painel de Evidências (Court Record) */
        .court-record-panel {
            background-color: #1a1a26;
            border: 1px dashed var(--primary);
            padding: 10px;
            border-radius: 6px;
        }

        .record-title {
            font-size: 0.8rem;
            color: var(--primary);
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .evidence-chip {
            background: #252538;
            border: 1px solid #444455;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .present-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 3px 6px;
            font-size: 0.7rem;
            cursor: pointer;
            border-radius: 3px;
        }

        .present-btn:active { background: #23527c; }

        /* Alerta de Contradição / Punição */
        .alert-box {
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }
        .success-box { background: #1a331a; color: #5cb85c; border: 1px solid #4cae4c; }
        .danger-box { background: #331a1a; color: #d9534f; border: 1px solid #d43f3a; }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <h1>TRIBUNAL DE CAUCAIA - CASO CUMBUCO</h1>
        </header>

        <main id="gameApp">
            <!-- Renderizado dinamicamente via JS -->
        </main>
    </div>

    <script>
        // Estrutura estilo Ace Attorney focada em Investigação e Contradição de Testemunhas
        const CASE_DATA = {
            title: "O Mistério da Foz do Rio Cauípe",
            evidenceList: [
                { id: "bilhete", name: "Ponta de Bilhete Russo", desc: "Encontrada no bolso do vestido de frio." },
                { id: "unhas", name: "Resíduos de Pele nas Unhas", desc: "Material genético do assassino após luta corporal." },
                { id: "taca", name: "Pedaço de Taça com Vinho", desc: "Achei perto do corpo na areia do Cumbuco." },
                { id: "foto_turista", name: "Relatório do Kitesurfista", desc: "Depoimento do turista que encontrou o corpo." }
            ],
            steps: {
                "investigacao_inicial": {
                    speaker: "Delegado / Investigador",
                    sceneImage: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600",
                    summary: "Você chega à foz do Rio Cauípe, entre o rio e o mar do Cumbuco, em Caucaia. O corpo de uma mulher com vestido de frio e lenço branco no rosto está na areia. Um policial local te acompanha de perto, sorrindo de forma estranha.",
                    options: [
                        { text: "1. Examinar o corpo de perto", nextStep: "examinar_corpo" },
                        { text: "2. Investigar a cena na areia", nextStep: "examinar_cenario" },
                        { text: "3. Falar com o Turista de Kitesurf", nextStep: "falar_turista" }
                    ]
                },
                "examinar_corpo": {
                    speaker: "Perícia Técnica",
                    sceneImage: "https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=600",
                    summary: "Você levanta o lenço branco: cabelo loiro, sem sangue, marcas de enforcamento e pescoço roxo. No bolso, uma caneta russa e uma ponta de bilhete. Nas unhas, pele do assassino. Você guarda as provas na caderneta.",
                    addEvidence: "unhas",
                    options: [
                        { text: "Voltar a olhar o cenário na areia", nextStep: "examinar_cenario" },
                        { text: "Confrontar o policial local", nextStep: "testemunho_policial" }
                    ]
                },
                "examinar_cenario": {
                    speaker: "Cena do Crime (Cumbuco)",
                    sceneImage: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=600",
                    summary: "Na areia fofa, há uma taça de vinho quebrada. O policial local aponta para o horizonte e diz: 'Foi aquele turista ali que andava de kitesurf quem fez isso, tenho certeza!'.",
                    addEvidence: "taca",
                    options: [
                        { text: "Examinar o corpo da vítima", nextStep: "examinar_corpo" },
                        { text: "Ouvir o depoimento do Policial Local", nextStep: "testemunho_policial" }
                    ]
                },
                "falar_turista": {
                    speaker: "Turista / Kitesurfista",
                    sceneImage: "https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=600",
                    summary: "O turista diz: 'Eu só achei o corpo! Mas notei que este policial que está te acompanhando tentou mexer nos bolsos da vítima escondido antes de você chegar aqui!'.",
                    addEvidence: "foto_turista",
                    options: [
                        { text: "Ir para o acareação com o Policial Local", nextStep: "testemunho_policial" }
                    ]
                },
                "testemunho_policial": {
                    speaker: "Policial Local (Suspeito)",
                    sceneImage: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600",
                    summary: "TESTEMUNHO DO POLICIAL: 'Eu garanto que cheguei junto com o turista e o corpo estava intocado! Não mexi em nada e o assassino só pode ser esse estrangeiro do kitesurf que passava por perto!'",
                    isTestimony: true,
                    contradictionEvidence: "foto_turista", // A prova que contradiz o mentiroso
                    successNext: "vitoria_tribunal",
                    failNext: "derrota_processo"
                }
            }
        };

        let gameState = JSON.parse(localStorage.getItem('ace_cumbuco_state')) || {
            currentStep: "investigacao_inicial",
            collectedEvidenceIds: []
        };

        function renderGame() {
            const app = document.getElementById('gameApp');
            const stepData = CASE_DATA.steps[gameState.currentStep];

            // Coleta prova automática da etapa se houver
            if (stepData.addEvidence && !gameState.collectedEvidenceIds.includes(stepData.addEvidence)) {
                gameState.collectedEvidenceIds.push(stepData.addEvidence);
                saveState();
            }

            let html = `
                <div class="dialogue-box">
                    <div class="speaker-tag">${stepData.speaker}</div>
                    ${stepData.sceneImage ? `<img src="${stepData.sceneImage}" class="scene-image">` : ''}
                    <div class="dialogue-text">${stepData.summary}</div>
            `;

            if (stepData.isTestimony) {
                html += `
                    <div style="background: #222; border-left: 3px solid #ffcc00; padding: 10px; margin-bottom: 12px; font-size: 0.85rem;">
                        ⚠️ <strong>CONFRONTO DE TESTEMUNHO:</strong> O depoimento acima possui uma mentira evidente. Escolha na sua <em>Caderneta de Evidências</em> abaixo qual prova usar para desmascarar esta mentira!
                    </div>
                `;
            } else if (stepData.options) {
                html += `<div class="actions-grid">`;
                stepData.options.forEach(opt => {
                    html += `<button class="btn-action" onclick="goToStep('${opt.nextStep}')">🔍 ${opt.text}</button>`;
                });
                html += `</div>`;
            }

            html += `</div>`; // Fecha dialogue-box

            // Painel da Caderneta de Evidências (Court Record) visível
            html += `
                <div class="court-record-panel" style="margin-top: 15px;">
                    <div class="record-title">📁 Caderneta de Evidências (${gameState.collectedEvidenceIds.length} coletadas)</div>
            `;

            if (gameState.collectedEvidenceIds.length === 0) {
                html += `<div style="font-size: 0.75rem; color: var(--text-muted);">Nenhuma evidência recolhida ainda. Investigue os cenários.</div>`;
            } else {
                gameState.collectedEvidenceIds.forEach(evId => {
                    let evObj = CASE_DATA.evidenceList.find(e => e.id === evId);
                    if (evObj) {
                        html += `
                            <div class="evidence-chip">
                                <div><strong>${evObj.name}</strong><br><span style="color:#aaa; font-size:0.65rem;">${evObj.desc}</span></div>
                                ${stepData.isTestimony ? `<button class="present-btn" onclick="presentEvidence('${evObj.id}')">APRESENTAR</button>` : ''}
                            </div>
                        `;
                    }
                });
            }

            html += `</div>`; // Fecha court-record-panel

            if (gameState.currentStep === "vitoria_tribunal" || gameState.currentStep === "derrota_processo") {
                html += `<button class="btn-action" style="margin-top: 15px; width:100%; text-align:center; background: var(--primary); color:#121212; font-weight:bold;" onclick="resetGame()">JOGAR NOVAMENTE</button>`;
            }

            app.innerHTML = html;
        }

        function goToStep(stepName) {
            gameState.currentStep = stepName;
            saveState();
            renderGame();
        }

        function presentEvidence(evidenceId) {
            const stepData = CASE_DATA.steps[gameState.currentStep];
            if (!stepData.isTestimony) return;

            if (evidenceId === stepData.contradictionEvidence) {
                // Sucesso - Ace Attorney Style Objection!
                gameState.currentStep = "vitoria_tribunal";
                saveState();
                showEnding(true);
            } else {
                // Erro - Punição por apresentar prova errada
                alert("OBJEÇÃO INCORRETA! O depoimento resistiu à sua acusação. O suspeito ganhou força jurídica e o inocentou prematuramente.");
                gameState.currentStep = "derrota_processo";
                saveState();
                showEnding(false);
            }
        }

        function showEnding(isSuccess) {
            const app = document.getElementById('gameApp');
            if (isSuccess) {
                app.innerHTML = `
                    <div class="dialogue-box">
                        <div class="speaker-tag" style="background:#5cb85c;">OBJEÇÃO ACEITA! (VITÓRIA)</div>
                        <p class="dialogue-text" style="color: #5cb85c; font-weight: bold;">
                            Você apresentou o relatório do turista provando que o policial tentou adulterar os bolsos da vítima! O disfarce do político corrupto cai por terra. Ele confessa o assassinato pelo cofre suíço e a tentativa de jogar a culpa no inocente. Justiça feita em Cumbuco!
                        </p>
                        <button class="btn-action" style="width:100%; text-align:center; background: var(--primary); color:#121212; font-weight:bold;" onclick="resetGame()">Jogar Novamente</button>
                    </div>
                `;
            } else {
                app.innerHTML = `
                    <div class="dialogue-box">
                        <div class="speaker-tag" style="background:var(--accent-red);">DERROTADO NO TRIBUNAL</div>
                        <p class="dialogue-text" style="color: var(--accent-red); font-weight: bold;">
                            Você apresentou a evidência errada! O advogado do policial corrupto usou a falha processual para destruir o inquérito. Você foi afastado por incompetência e o verdadeiro assassino escapou para a Suíça.
                        </p>
                        <button class="btn-action" style="width:100%; text-align:center; background: var(--accent-red); color:#fff; font-weight:bold;" onclick="resetGame()">Tentar Novamente</button>
                    </div>
                `;
            }
        }

        function saveState() {
            localStorage.setItem('ace_cumbuco_state', JSON.stringify(gameState));
        }

        function resetGame() {
            localStorage.removeItem('ace_cumbuco_state');
            gameState = { currentStep: "investigacao_inicial", collectedEvidenceIds: [] };
            renderGame();
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderGame();
        });
    </script>
</body>
</html>
