<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Missões - Investigação</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e8b4b8">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #e8b4b8;
            --primary-light: #f3d6d8;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --border-color: #333333;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 0.85rem;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .mission-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .mission-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            border-radius: 6px;
        }

        .mission-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .mission-title {
            font-size: 1.1rem;
            color: var(--primary-light);
            margin: 0;
        }

        .badge {
            align-self: flex-start;
            font-size: 0.75rem;
            padding: 3px 6px;
            border-radius: 3px;
            background: #333;
            color: var(--primary-color);
        }

        .mission-summary {
            color: #b0b0b0;
            font-size: 0.9rem;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-option {
            background-color: #252525;
            color: #e0e0e0;
            border: 1px solid #444;
            border-left: 4px solid var(--primary-color);
            padding: 12px 15px;
            text-align: left;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-option:active {
            background-color: #333;
        }

        .btn-launch {
            width: 100%;
            background-color: var(--primary-color);
            color: #121212;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn-launch:active {
            background-color: var(--primary-light);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CENTRAL DE INVESTIGAÇÃO</h1>
            <p class="subtitle">Sistema de Casos e Perícia</p>
        </header>

        <main class="mission-grid" id="missionGrid">
            <!-- Carregado via script local -->
        </main>
    </div>

    <script>
        // Banco de dados embutido (Sem erro de carregamento no celular)
        const GAME_DATA = {
    missions: [
        {
            id: "missao-cumbuco",
            title: "O Mistério da Duna e da Maré",
            difficulty: "Difícil (Caso Altamente Complexo)",
            evidenceRequired: 4, // Exige rigor máximo nas provas para não ser incriminado
            steps: {
                "inicio": {
                    summary: "Você é chamado às pressas para uma ocorrência na divisa entre a foz do Rio Cauípe e o mar do Cumbuco, em Caucaia. Um turista que fazia kitesurf encontrou o corpo de uma mulher sobre a areia. Ela veste roupas pesadas de frio (estilo escandinavo), mas o calor do Cumbuco é implacável. Um lenço branco cobre o seu rosto, revelando apenas alguns fios de cabelo loiro. Há um policial local (que atendeu o chamado do turista) acompanhando cada passo seu de perto.",
                    image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600",
                    options: [
                        { text: "1. Examinar o corpo da vítima de perto", nextStep: "examinar_corpo" },
                        { text: "2. Investigar o cenário e os arredores na areia", nextStep: "examinar_cenario" },
                        { text: "3. Interrogar o turista que encontrou o corpo", nextStep: "interrogar_turista" }
                    ]
                },
                "examinar_corpo": {
                    summary: "Ao retirar cuidadosamente o lenço branco, você vê uma mulher sem marcas de sangue, mas com nítidas marcas de enforcamento no pescoço. O corpo está surpreendentemente conservado, sem sinais de decomposição. No bolso do vestido de frio, há uma caneta rara característica do norte da Rússia e a ponta de um bilhete rasgado. Nas unhas dela, há resíduos de pele humana (sinais de luta corporal). Um de seus sapatos de salto alto está sem o salto.",
                    image: "https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=600",
                    isEvidence: true,
                    evidenceName: "Unhas com pele do assassino e Caneta Russa",
                    options: [
                        { text: "Analisar o cenário do crime na areia", nextStep: "examinar_cenario" },
                        { text: "Questionar o policial que primeiro chegou ao local", nextStep: "investigar_policial" },
                        { text: "Tentar concluir o caso agora", nextStep: "verificar_acusacao" }
                    ]
                },
                "examinar_cenario": {
                    summary: "Perto do corpo, na areia fofa, você acha um pedaço de taça de vidro quebrada e suja de vinho. O policial local se aproxima rapidamente e diz: 'Olha só, detetive... esse turista de kitesurf estava circulando muito perto daqui antes de chamar a gente. Repare que o sapato dele tem resisto de lama fresca e ele parecia nervoso'. O policial tenta sutilmente plantar uma luva do turista perto das evidências.",
                    image: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=600",
                    isEvidence: true,
                    evidenceName: "Taça de vinho quebrada e Pista manipulada",
                    options: [
                        { text: "Voltar a examinar o corpo", nextStep: "examinar_corpo" },
                        { text: "Investigar o histórico do turista e do policial", nextStep: "confrontar_pistas" },
                        { text: "Fazer a acusação final do assassino", nextStep: "verificar_acusacao" }
                    ]
                },
                "interrogar_turista": {
                    summary: "O turista jura inocência: 'Eu só andava para ver o vento para o kitesurf! Quando vi o corpo, chamei a polícia imediatamente. Mas notei que o policial que atendeu a ocorrência parecia excessivamente preocupado em mexer nos bolsos da vítima antes de você chegar...'.",
                    image: "https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=600",
                    isEvidence: true,
                    evidenceName: "Depoimento do Turista sobre o Policial",
                    options: [
                        { text: "Verificar o corpo detalhadamente", nextStep: "examinar_corpo" },
                        { text: "Investigar a vida da vítima (falsa identidade europeia)", nextStep: "confrontar_pistas" },
                        { text: "Efetuar a prisão do verdadeiro culpado", nextStep: "verificar_acusacao" }
                    ]
                },
                "confrontar_pistas": {
                    summary: "Você cruza os dados: a mulher era cearense, mas o namorado político dela (que fingia que ela era da Europa) tinha acesso à senha de um cofre na Suíça. O policial que atende o caso é, na verdade, esse mesmo político disfarçado/comparsa na força pública, que tentou culpar o turista para acobertar o assassinato por cobiça financeira e a senha do banco suíço!",
                    image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600",
                    isEvidence: true,
                    evidenceName: "Dossiê do Policial Corrupto e Cofre Suíço",
                    options: [
                        { text: "Prender o Policial Corrupto agora com todas as provas", nextStep: "verificar_acusacao" }
                    ]
                }
            }
        }
    ]
};


        document.addEventListener("DOMContentLoaded", () => {
            loadGame();
        });

        function loadGame() {
            const mission = GAME_DATA.missions[0];
            let savedState = JSON.parse(localStorage.getItem('carmen_progress')) || {
                currentStep: "inicio",
                collectedEvidence: []
            };
            renderGame(mission, savedState);
        }

        function renderGame(mission, state) {
            const grid = document.getElementById('missionGrid');
            grid.innerHTML = '';

            const currentStepData = mission.steps[state.currentStep] || mission.steps["inicio"];
            let card = document.createElement('div');
            card.className = 'mission-card';

            let imageHtml = currentStepData.image ? `
                <div style="margin-bottom: 15px;">
                    <img src="${currentStepData.image}" alt="Cena" style="width: 100%; height: 160px; object-fit: cover; border-radius: 4px; border: 1px solid #444;">
                </div>
            ` : '';

            // Coleta prova automaticamente se houver
            if (currentStepData.isEvidence && !state.collectedEvidence.includes(currentStepData.evidenceName)) {
                state.collectedEvidence.push(currentStepData.evidenceName);
                localStorage.setItem('carmen_progress', JSON.stringify(state));
            }

            let optionsHtml = '';

            if (currentStepData.isFinal) {
                optionsHtml = `
                    <div style="background: #1a3a1a; padding: 15px; border-radius: 4px; border: 1px solid #4CAF50; margin-bottom: 15px;">
                        <p style="color: #4CAF50; font-weight: bold; margin: 0;">${currentStepData.summary}</p>
                    </div>
                    <button class="btn-launch" onclick="resetGame()" style="background-color: #e8b4b8; color: #121212;">
                        Jogar Novamente
                    </button>
                `;
            } else if (currentStepData.isFailed) {
                optionsHtml = `
                    <div style="background: #3a1a1a; padding: 15px; border-radius: 4px; border: 1px solid #f44336; margin-bottom: 15px;">
                        <p style="color: #f44336; font-weight: bold; margin: 0;">${currentStepData.summary}</p>
                    </div>
                    <button class="btn-launch" onclick="resetGame()" style="background-color: #f44336; color: #fff;">
                        Tentar Novamente (Afastado por Processo)
                    </button>
                `;
            } else {
                optionsHtml = currentStepData.options.map(opt => `
                    <button class="btn-option" onclick="makeChoice('${opt.nextStep}')">
                        🔍 ${opt.text}
                    </button>
                `).join('');

                optionsHtml += `
                    <button class="btn-launch" onclick="checkAcquisition(${mission.evidenceRequired})" style="margin-top: 15px; background-color: #d4af37; color: #121212;">
                        ⚖️ Efetuar Prisão / Acusação (${state.collectedEvidence.length}/${mission.evidenceRequired} Provas)
                    </button>
                `;
            }

            let evidenceListHtml = state.collectedEvidence.length > 0 
                ? state.collectedEvidence.map(ev => `<li style="font-size: 0.8rem; color: #e8b4b8;">✔ ${ev}</li>`).join('')
                : `<span style="font-size: 0.8rem; color: #777;">Nenhuma pista forte coletada ainda.</span>`;

            card.innerHTML = `
                <div class="mission-header">
                    <h2 class="mission-title">${mission.title}</h2>
                    <span class="badge">Dificuldade: ${mission.difficulty}</span>
                </div>
                ${imageHtml}
                <p class="mission-summary">${currentStepData.summary}</p>
                
                <div style="background: #181818; padding: 10px; border-radius: 4px; margin-bottom: 15px; border: 1px dashed #444;">
                    <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">📁 Caderneta de Provas do Investigador:</div>
                    <ul style="margin: 0; padding-left: 15px;">${evidenceListHtml}</ul>
                </div>

                <div class="options-container">
                    ${optionsHtml}
                </div>
            `;

            grid.appendChild(card);
        }

        function makeChoice(nextStep) {
            let state = JSON.parse(localStorage.getItem('carmen_progress')) || { collectedEvidence: [] };
            state.currentStep = nextStep;
            localStorage.setItem('carras_progress', JSON.stringify(state)); // mantido seguro
            localStorage.setItem('carmen_progress', JSON.stringify(state));
            loadGame();
        }

        function checkAcquisition(requiredCount) {
            let state = JSON.parse(localStorage.getItem('carmen_progress')) || { collectedEvidence: [] };
            const mission = GAME_DATA.missions[0];

            if (state.collectedEvidence.length >= requiredCount) {
                mission.steps["resultado_sucesso"] = {
                    summary: "PARABÉNS! Com base nas provas recolhidas, o juiz emitiu o mandado. O infrator foi condenado e sua reputação está salva!",
                    isFinal: true
                };
                makeChoice("resultado_sucesso");
            } else {
                mission.steps["resultado_falha"] = {
                    summary: "ERRO CRÍTICO! Você prendeu o suspeito sem provas suficientes. O advogado dele abriu um processo por abuso de autoridade e você foi afastado!",
                    isFailed: true
                };
                makeChoice("resultado_falha");
            }
        }

        function resetGame() {
            localStorage.removeItem('carmen_progress');
            loadGame();
        }
    </script>
</body>
</html>
